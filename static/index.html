<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토지 면적 조회 시스템</title>
    <!-- 구글 폰트 적용 (Pretendard 또는 Noto Sans KR 느낌의 모던 폰트) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <main class="container">
        <header class="header">
            <h1>토지 면적 조회</h1>
            <p>정확한 지번 주소를 입력하여 면적을 확인하세요.</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-target="single-search">단건 조회</button>
            <button class="tab-btn" data-target="batch-search">엑셀 대량 조회</button>
        </div>

        <section id="single-search" class="search-section tab-content active">
            <form id="search-form" class="search-form">
                <div class="input-group">
                    <input type="text" id="address-input" placeholder="예: 충남 홍성군 갈산면 기산리 582" required autocomplete="off">
                    <button type="submit" id="search-btn">조회하기</button>
                </div>
            </form>
            <div id="error-message" class="error-message"></div>
        </section>

        <section id="batch-search" class="search-section tab-content hidden">
            <div class="batch-controls">
                <p>엑셀 파일에 여러 주소를 적어 한 번에 조회할 수 있습니다. <br><strong>(안정적인 처리를 위해 한 번에 최대 100건까지만 가능합니다)</strong></p>
                <a href="/api/download-template" class="btn-outline" download>기본 양식 다운로드</a>
            </div>
            <form id="batch-form" class="batch-form">
                <div class="file-drop-area" id="file-drop-area">
                    <span class="file-msg">엑셀 파일을 드래그하거나 여기를 클릭하세요.</span>
                    <input type="file" id="file-input" accept=".xlsx" required>
                </div>
                <button type="submit" id="batch-submit-btn" class="batch-submit-btn" disabled>대량 변환 후 다운로드</button>
            </form>
            <div id="batch-error-message" class="error-message"></div>
        </section>

        <!-- 로딩 스피너 -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>데이터를 불러오는 중입니다...</p>
        </div>

        <!-- 결과 카드 (초기에는 숨김) -->
        <section id="result-card" class="result-card hidden">
            <div class="card-header">
                <h2>조회 결과</h2>
                <span id="stdr-year" class="badge">기준연도: -</span>
            </div>
            
            <div class="info-group">
                <span class="label">표준 주소</span>
                <p id="res-address" class="value">-</p>
            </div>
            
            <div class="info-group">
                <span class="label">지목</span>
                <p id="res-lndcgr" class="value">-</p>
            </div>
            
            <div class="area-display">
                <div class="area-box">
                    <span class="area-label">공부상 면적 (m²)</span>
                    <span id="res-area-m2" class="area-value highlight">-</span>
                </div>
                <div class="area-box">
                    <span class="area-label">환산 평수 (평)</span>
                    <span id="res-area-pyeong" class="area-value highlight pyeong">-</span>
                </div>
            </div>
            
            <div class="pnu-info">
                <span>PNU 코드: </span><span id="res-pnu">-</span>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
